[project]
name = "supportnova-server"
version = "0.1.0"
description = "SupportNova Generative AI & Ground-Truth Complaint Intelligence Backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "motor>=3.5.0",
    "pydantic[email]>=2.7.0",
    "email-validator>=2.1.0",
    "pydantic-settings>=2.2.0",
    "groq>=0.9.0",
    "pypdf>=4.2.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai", "lib", "middlewares", "models", "routes"]
